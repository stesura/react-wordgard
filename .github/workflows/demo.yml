name: demo

# The demo of the latest release: started by the release script
# (scripts/release.js) on master, the release commit, or by hand. The Pages
# environment deploys from master only.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Pages serves the site under /react-wordgard/, the Vue demo under /react-wordgard/vue/.
      - name: Build the demos
        run: |
          npx vite build --base /react-wordgard/ --outDir demo-dist
          npx vite build --config demo/vue/vite.config.ts --base /react-wordgard/vue/ --outDir ../../demo-dist/vue

      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo-dist

      - id: deployment
        uses: actions/deploy-pages@v4
