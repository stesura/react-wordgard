name: check

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - "**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Types, lint and format
        run: npm run check

      - name: Tests
        run: npm test
