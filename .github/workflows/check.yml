name: check

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - "**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    # The peer range is React 18 and 19; the lockfile pins 18.
    strategy:
      fail-fast: false
      matrix:
        react: [18, 19]

    name: check (React ${{ matrix.react }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Switch to React 19
        if: matrix.react == 19
        run: npm i --no-save react@19 react-dom@19 react-reconciler@0.33 @types/react@19 @types/react-dom@19

      - name: Install the browsers for the browser tests
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build
        run: npm run build

      - name: Types, lint and format
        run: npm run check

      - name: Tests
        run: npm test
