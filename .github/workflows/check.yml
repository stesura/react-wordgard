name: check

# Not on every push: on pull requests, by hand, and from the release script
# (scripts/release.js), on the release commit.
on:
  pull_request:
    branches:
      - "**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The Playwright version the lockfile pins, for the image the checks run in.
  playwright:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"

  check:
    needs: playwright
    runs-on: ubuntu-latest

    # Playwright's image has the browsers and their system libraries: installing
    # those took from a minute to eleven, most of it apt.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
      options: --user 1001

    # The peer ranges are React 18 and 19, and the exact wordgard the lockfile
    # pins; the lockfile pins React 18.
    strategy:
      fail-fast: false
      matrix:
        react: [18, 19]

    name: check (React ${{ matrix.react }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Switch to React 19
        if: matrix.react == 19
        run: npm i --no-save react@19 react-dom@19 @types/react@19 @types/react-dom@19

      - name: Build
        run: npm run build

      - name: Types, lint and format
        run: npm run check

      - name: Tests
        run: npm test
