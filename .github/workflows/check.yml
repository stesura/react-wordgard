name: check

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - "**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    # The peer ranges are React 18 and 19, and wordgard's patches; the lockfile
    # pins React 18 and one wordgard. A patch can still change the internals we
    # use, so the newest one in range gets a job too.
    strategy:
      fail-fast: false
      matrix:
        react: [18, 19]
        wordgard: [locked]
        include:
          - react: 18
            wordgard: newest

    name: check (React ${{ matrix.react }}, ${{ matrix.wordgard }} wordgard)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Switch to React 19
        if: matrix.react == 19
        run: npm i --no-save react@19 react-dom@19 @types/react@19 @types/react-dom@19

      - name: Switch to the newest wordgard in the peer range
        if: matrix.wordgard == 'newest'
        run: npm i --no-save "wordgard@$(npm pkg get peerDependencies.wordgard | tr -d '"')"

      - name: Install the browsers for the browser tests
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build
        run: npm run build

      - name: Types, lint and format
        run: npm run check

      - name: Tests
        run: npm test
