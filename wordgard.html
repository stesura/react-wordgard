<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No favicon: an empty one stops the browser asking for /favicon.ico. -->
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>react-wordgard Demo (Wordgard)</title>
    <style>
      main {
        margin: auto;
        width: 80%;
        max-width: 700px;
      }
    </style>
  </head>

  <body>
    <main>
      <p>

    <script

      src="//unpkg.com/react-scan@0.5.7/dist/auto.global.js"
      strategy="beforeInteractive"
